name: 每日拉取金山文档影视上新表

on:
  schedule:
    # 每天 00:35 UTC = 北京时间 08:35（文档一般在上午更新）
    - cron: "35 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kdocs-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq fonts-noto-cjk || true

      - name: Fetch kdocs snapshot
        run: |
          python tools/kdocs_fetch_ci.py --days 3 --output data/kdocs_new.json
          echo "---- 快照预览 ----"
          head -c 600 data/kdocs_new.json

      - name: Commit if changed
        run: |
          git config user.name "hmily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/kdocs_new.json
          if git diff --cached --quiet; then
            echo "快照无变化，跳过提交"
          else
            git commit -m "chore: 更新金山文档影视上新快照 $(date -u +%F)"
            git push
          fi
